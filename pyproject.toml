[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-growth-control-tower"
version = "0.1.0"
description = "Explainable cross-channel e-commerce funnel and campaign diagnostics"
requires-python = ">=3.10"
authors = [{name = "Syed Muslim Shah"}]
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
